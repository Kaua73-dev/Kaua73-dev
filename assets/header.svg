<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Kaua Santana Jeronimo - Backend Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090C11"/>
      <stop offset="55%" stop-color="#10141B"/>
      <stop offset="100%" stop-color="#1B0E10"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9DEBFF" stop-opacity=".55"/>
      <stop offset="45%" stop-color="#2FB8E8" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#2FB8E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="32%" stop-color="#D6F7FF"/>
      <stop offset="72%" stop-color="#3FD0FF"/>
      <stop offset="100%" stop-color="#0B6F9E"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B01E28"/>
      <stop offset="45%" stop-color="#E62429"/>
      <stop offset="80%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB300" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFD98A" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#FFB300" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="glowS" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1000" height="320" rx="16"/></clipPath>
  </defs>

  <style>
    @keyframes spin      { from { transform: rotate(0deg);   } to { transform: rotate(360deg);  } }
    @keyframes spinRev   { from { transform: rotate(0deg);   } to { transform: rotate(-360deg); } }
    @keyframes breathe   { 0%,100% { opacity:.62; transform: scale(.94); } 50% { opacity:1; transform: scale(1.06); } }
    @keyframes haloPulse { 0%,100% { opacity:.55; transform: scale(.97); } 50% { opacity:.95; transform: scale(1.05); } }
    @keyframes sweepX    { 0% { transform: translateX(-260px); } 100% { transform: translateX(1060px); } }
    @keyframes blink     { 0%,46% { opacity:1; } 54%,100% { opacity:.18; } }
    @keyframes charge    { 0%,100% { opacity:.28; } 50% { opacity:.95; } }
    @keyframes rise      { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }
    @keyframes widen     { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes bracket   { from { opacity:0; } to { opacity:.85; } }

    .spinA   { animation: spin 22s linear infinite; }
    .spinB   { animation: spinRev 14s linear infinite; }
    .spinC   { animation: spin 9s linear infinite; }
    .coreA   { animation: breathe 2.6s ease-in-out infinite; }
    .haloA   { animation: haloPulse 2.6s ease-in-out infinite; }
    .sweepA  { animation: sweepX 7.5s linear infinite; }
    .dot     { animation: blink 1.7s steps(1,end) infinite; }
    .coil    { animation: charge 2.2s ease-in-out infinite; }
    .r1      { animation: rise .7s ease-out .15s both; }
    .r2      { animation: rise .7s ease-out .35s both; }
    .r3      { animation: rise .7s ease-out .55s both; }
    .r4      { animation: rise .7s ease-out .8s both; }
    .grow    { animation: widen .9s cubic-bezier(.2,.8,.2,1) .5s both; }
    .brk     { animation: bracket .6s ease-out 1s both; }

    @media (prefers-reduced-motion: reduce) {
      .spinA,.spinB,.spinC,.coreA,.haloA,.sweepA,.dot,.coil { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>
    <rect class="sweepA" x="0" y="0" width="240" height="320" fill="url(#sweep)"/>

    <!-- ================= ARC REACTOR ================= -->
    <g transform="translate(168,160)">
      <circle class="haloA" r="118" fill="url(#halo)"/>

      <!-- anel externo pontilhado -->
      <g class="spinA">
        <circle r="98" fill="none" stroke="#FFB300" stroke-opacity=".38" stroke-width="1.4" stroke-dasharray="2 10" stroke-linecap="round"/>
      </g>

      <!-- marcações HUD -->
      <g class="spinB">
        <circle r="86" fill="none" stroke="#E62429" stroke-opacity=".55" stroke-width="2" stroke-dasharray="30 16" stroke-linecap="round"/>
        <path d="M0 -104 L6 -94 L-6 -94 Z" fill="#FFB300" opacity=".8"/>
      </g>

      <circle r="74" fill="none" stroke="#3FD0FF" stroke-opacity=".3" stroke-width="1"/>

      <!-- bobinas -->
      <g class="spinC">
        <rect class="coil" x="-4.5" y="-66" width="9" height="17" rx="3.5" fill="#FFB300"/>
        <rect class="coil" x="-4.5" y="-66" width="9" height="17" rx="3.5" fill="#FFB300" transform="rotate(45)"  style="animation-delay:.14s"/>
        <rect class="coil" x="-4.5" y="-66" width="9" height="17" rx="3.5" fill="#FFB300" transform="rotate(90)"  style="animation-delay:.28s"/>
        <rect class="coil" x="-4.5" y="-66" width="9" height="17" rx="3.5" fill="#FFB300" transform="rotate(135)" style="animation-delay:.42s"/>
        <rect class="coil" x="-4.5" y="-66" width="9" height="17" rx="3.5" fill="#FFB300" transform="rotate(180)" style="animation-delay:.56s"/>
        <rect class="coil" x="-4.5" y="-66" width="9" height="17" rx="3.5" fill="#FFB300" transform="rotate(225)" style="animation-delay:.7s"/>
        <rect class="coil" x="-4.5" y="-66" width="9" height="17" rx="3.5" fill="#FFB300" transform="rotate(270)" style="animation-delay:.84s"/>
        <rect class="coil" x="-4.5" y="-66" width="9" height="17" rx="3.5" fill="#FFB300" transform="rotate(315)" style="animation-delay:.98s"/>
      </g>

      <!-- triângulo do reator (Mark L) -->
      <g class="spinB">
        <path d="M0 -44 L38.1 22 L-38.1 22 Z" fill="none" stroke="#3FD0FF" stroke-opacity=".75" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M0 -44 L38.1 22 L-38.1 22 Z" fill="#3FD0FF" opacity=".08"/>
      </g>

      <circle r="31" fill="none" stroke="#9DEBFF" stroke-opacity=".5" stroke-width="1.2"/>

      <!-- núcleo -->
      <circle class="coreA" r="36" fill="#3FD0FF" opacity=".3" filter="url(#glow)"/>
      <circle class="coreA" r="21" fill="url(#core)"/>
      <circle class="coreA" r="9" fill="#FFFFFF" filter="url(#glowS)"/>
    </g>

    <!-- ================= TELEMETRIA / NOME ================= -->
    <g transform="translate(322,0)">
      <rect class="r1" x="0" y="96" width="3" height="118" rx="1.5" fill="url(#rule)"/>

      <g class="r1">
        <text x="20" y="118" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" letter-spacing="4.5" fill="#FFB300">STARK INDUSTRIES</text>
        <text x="215" y="118" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" letter-spacing="4.5" fill="#6E8299">/ JAVA DIVISION</text>
      </g>

      <text class="r2" x="18" y="166" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="37" font-weight="700" letter-spacing="1.2" fill="#F2F6FA">KAUÃ SANTANA JERÔNIMO</text>

      <g transform="translate(18,184)">
        <rect class="grow" x="0" y="0" width="470" height="2.5" rx="1.25" fill="url(#rule)"/>
      </g>

      <text class="r3" x="18" y="212" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="14.5" letter-spacing="1.6" fill="#93A7BC">Backend Developer &#183; Spring &#183; Microsserviços</text>

      <g class="r4" transform="translate(18,244)">
        <circle class="dot" cx="5" cy="-4" r="4.5" fill="#42E08B"/>
        <text x="18" y="0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12.5" letter-spacing="2.2" fill="#42E08B">SISTEMAS ONLINE</text>
        <text x="182" y="0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12.5" letter-spacing="2.2" fill="#FFB300">REATOR ARC 100%</text>
        <text x="372" y="0" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12.5" letter-spacing="2.2" fill="#E62429">MARK LXXXV</text>
      </g>
    </g>

    <!-- cantos HUD -->
    <g class="brk" fill="none" stroke="#FFB300" stroke-width="2" stroke-linecap="round">
      <path d="M18 54 V26 H54"/>
      <path d="M982 54 V26 H946"/>
      <path d="M18 266 V294 H54"/>
      <path d="M982 266 V294 H946"/>
    </g>
    <rect x="1" y="1" width="998" height="318" rx="16" fill="none" stroke="#FFB300" stroke-opacity=".14" stroke-width="2"/>
  </g>
</svg>
