<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 404" width="900" height="404" role="img" aria-label="Diagnostico da armadura - stack tecnica" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0D12"/>
      <stop offset="100%" stop-color="#12161D"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B01E28"/>
      <stop offset="52%" stop-color="#E62429"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB300" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0"/>
    </linearGradient>
    <pattern id="g2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#FFB300" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <clipPath id="fr2"><rect width="900" height="404" rx="14"/></clipPath>
  </defs>

  <style>
    @keyframes fill  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink2{ 0%,46% { opacity:1; } 54%,100% { opacity:.2; } }
    @keyframes tick  { from { opacity:0; } to { opacity:1; } }
    @keyframes glide { 0% { transform: translateX(0); opacity:0; } 12% { opacity:.9; } 88% { opacity:.9; } 100% { transform: translateX(455px); opacity:0; } }

    .b   { animation: fill 1.15s cubic-bezier(.16,.84,.34,1) both; }
    .lb  { animation: tick .5s ease-out both; }
    .pl  { animation: blink2 1.6s steps(1,end) infinite; }
    .sh  { animation: glide 3.4s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) { .pl,.sh { animation: none; } }
  </style>

  <g clip-path="url(#fr2)">
    <rect width="900" height="404" fill="url(#panel)"/>
    <rect width="900" height="404" fill="url(#g2)"/>

    <!-- cabeçalho -->
    <text x="42" y="52" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" font-weight="700" letter-spacing="3.4" fill="#FFB300">MARK LXXXV &#9656; DIAGNÓSTICO DA ARMADURA</text>
    <circle class="pl" cx="782" cy="47" r="4.5" fill="#42E08B"/>
    <text x="795" y="52" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12.5" letter-spacing="2" fill="#42E08B">ESTÁVEL</text>
    <rect x="42" y="68" width="816" height="1.6" fill="url(#hdr)"/>

    <!-- ROW 1 -->
    <g class="lb" style="animation-delay:.05s">
      <text x="42" y="113" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13.5" letter-spacing="1.4" fill="#D3DEEA">JAVA &#183; NÚCLEO</text>
      <g transform="translate(290,102)">
        <rect width="460" height="9" rx="4.5" fill="#171C24"/>
        <g class="b" style="animation-delay:.2s"><rect width="442" height="9" rx="4.5" fill="url(#bar)"/></g>
        <rect class="sh" x="0" y="0" width="5" height="9" fill="#FFF3D0" opacity="0" style="animation-delay:1.3s"/>
      </g>
      <text x="772" y="113" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12.5" fill="#FFB300">ONLINE</text>
    </g>

    <!-- ROW 2 -->
    <g class="lb" style="animation-delay:.14s">
      <text x="42" y="151" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13.5" letter-spacing="1.4" fill="#D3DEEA">SPRING BOOT</text>
      <g transform="translate(290,140)">
        <rect width="460" height="9" rx="4.5" fill="#171C24"/>
        <g class="b" style="animation-delay:.32s"><rect width="432" height="9" rx="4.5" fill="url(#bar)"/></g>
        <rect class="sh" x="0" y="0" width="5" height="9" fill="#FFF3D0" opacity="0" style="animation-delay:1.45s"/>
      </g>
      <text x="772" y="151" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12.5" fill="#FFB300">ONLINE</text>
    </g>

    <!-- ROW 3 -->
    <g class="lb" style="animation-delay:.23s">
      <text x="42" y="189" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13.5" letter-spacing="1.4" fill="#D3DEEA">MICROSSERVIÇOS</text>
      <g transform="translate(290,178)">
        <rect width="460" height="9" rx="4.5" fill="#171C24"/>
        <g class="b" style="animation-delay:.44s"><rect width="414" height="9" rx="4.5" fill="url(#bar)"/></g>
        <rect class="sh" x="0" y="0" width="5" height="9" fill="#FFF3D0" opacity="0" style="animation-delay:1.6s"/>
      </g>
      <text x="772" y="189" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12.5" fill="#FFB300">ONLINE</text>
    </g>

    <!-- ROW 4 -->
    <g class="lb" style="animation-delay:.32s">
      <text x="42" y="227" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13.5" letter-spacing="1.4" fill="#D3DEEA">APIs REST</text>
      <g transform="translate(290,216)">
        <rect width="460" height="9" rx="4.5" fill="#171C24"/>
        <g class="b" style="animation-delay:.56s"><rect width="428" height="9" rx="4.5" fill="url(#bar)"/></g>
        <rect class="sh" x="0" y="0" width="5" height="9" fill="#FFF3D0" opacity="0" style="animation-delay:1.75s"/>
      </g>
      <text x="772" y="227" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12.5" fill="#FFB300">ONLINE</text>
    </g>

    <!-- ROW 5 -->
    <g class="lb" style="animation-delay:.41s">
      <text x="42" y="265" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13.5" letter-spacing="1.4" fill="#D3DEEA">DOCKER &#183; GIT</text>
      <g transform="translate(290,254)">
        <rect width="460" height="9" rx="4.5" fill="#171C24"/>
        <g class="b" style="animation-delay:.68s"><rect width="400" height="9" rx="4.5" fill="url(#bar)"/></g>
        <rect class="sh" x="0" y="0" width="5" height="9" fill="#FFF3D0" opacity="0" style="animation-delay:1.9s"/>
      </g>
      <text x="772" y="265" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12.5" fill="#FFB300">ONLINE</text>
    </g>

    <!-- ROW 6 -->
    <g class="lb" style="animation-delay:.5s">
      <text x="42" y="303" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13.5" letter-spacing="1.4" fill="#D3DEEA">SQL &#183; NoSQL</text>
      <g transform="translate(290,292)">
        <rect width="460" height="9" rx="4.5" fill="#171C24"/>
        <g class="b" style="animation-delay:.8s"><rect width="405" height="9" rx="4.5" fill="url(#bar)"/></g>
        <rect class="sh" x="0" y="0" width="5" height="9" fill="#FFF3D0" opacity="0" style="animation-delay:2.05s"/>
      </g>
      <text x="772" y="303" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12.5" fill="#FFB300">ONLINE</text>
    </g>

    <!-- ROW 7 -->
    <g class="lb" style="animation-delay:.59s">
      <text x="42" y="341" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13.5" letter-spacing="1.4" fill="#D3DEEA">DESIGN PATTERNS</text>
      <g transform="translate(290,330)">
        <rect width="460" height="9" rx="4.5" fill="#171C24"/>
        <g class="b" style="animation-delay:.92s"><rect width="419" height="9" rx="4.5" fill="url(#bar)"/></g>
        <rect class="sh" x="0" y="0" width="5" height="9" fill="#FFF3D0" opacity="0" style="animation-delay:2.2s"/>
      </g>
      <text x="772" y="341" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12.5" fill="#FFB300">ONLINE</text>
    </g>

    <rect x="42" y="364" width="816" height="1" fill="#FFB300" opacity=".16"/>
    <text x="42" y="387" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" letter-spacing="2.6" fill="#6E8299">JARVIS &#9656; armadura pronta. Pode subir em produção, senhor.</text>

    <rect x="1" y="1" width="898" height="402" rx="14" fill="none" stroke="#FFB300" stroke-opacity=".13" stroke-width="2"/>
  </g>
</svg>
