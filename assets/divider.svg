<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 16" width="1000" height="16" role="img" aria-label="divisor">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1B6F9E" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#1B6F9E" stop-opacity=".8"/>
      <stop offset="50%"  stop-color="#38D2FF"/>
      <stop offset="82%"  stop-color="#1B6F9E" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#1B6F9E" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pulse">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="35%"  stop-color="#9FF4FF" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#38D2FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes run { 0% { transform: translateX(-560px) } 100% { transform: translateX(560px) } }
    .run { animation: run 7s cubic-bezier(.42,0,.58,1) infinite; }
    /* Resting position is mid-rule, so the still frame reads as a lit divider
       rather than a blank one — and static rasterisers get the same frame. */
    @media (prefers-reduced-motion: reduce) { .run { animation: none } }
  </style>
  <rect x="0" y="7.2" width="1000" height="1.6" fill="url(#dl)"/>
  <g class="run">
    <circle cx="500" cy="8" r="8" fill="url(#pulse)"/>
    <circle cx="500" cy="8" r="1.8" fill="#FFFFFF"/>
  </g>
</svg>
