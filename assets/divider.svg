<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 18" width="1000" height="18" role="img" aria-label="divisor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFB300" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#B01E28" stop-opacity=".75"/>
      <stop offset="50%"  stop-color="#E62429"/>
      <stop offset="82%"  stop-color="#FFB300" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pulseG">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFD98A"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes run { 0% { transform: translateX(-40px); } 100% { transform: translateX(1040px); } }
    .run { animation: run 4.5s cubic-bezier(.45,0,.55,1) infinite; }
    @media (prefers-reduced-motion: reduce) { .run { animation: none; opacity:0; } }
  </style>
  <rect x="0" y="8" width="1000" height="2" fill="url(#dl)"/>
  <g class="run"><circle cx="0" cy="9" r="9" fill="url(#pulseG)"/><circle cx="0" cy="9" r="2.4" fill="#FFFFFF"/></g>
</svg>
